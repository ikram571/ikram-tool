name: Release IkramTool

on:
  push:
    tags:
      - 'V*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp VERSION + key metadata (mirrors release.sh)
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "${VERSION}" > VERSION
          printf '{\n  "version": "%s",\n  "key_hash": "7360b6c497b3f043eb4d74ae1100f8681b6a968719135cd6de7b58f3363d5c36"\n}\n' "${VERSION}" > ikram_key.json

      - name: Create release zip (asset MUST be IkramTool.zip)
        run: |
          zip -r IkramTool.zip . \
            -x "__pycache__/*" -x "*/__pycache__/*" \
            -x ".git/*" -x "*.log" -x "*.tmp" -x "*.bak" \
            -x "original/*" -x "logs/*" \
            -x "DROP/*" -x "RESULT/*" -x "output/*"
          ls -la IkramTool.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: IkramTool.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}